<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Subtle glow -->
  <circle cx="240" cy="180" r="300" fill="#f97316" opacity="0.08" filter="blur(60px)"/>
  <circle cx="1040" cy="540" r="320" fill="#38bdf8" opacity="0.07" filter="blur(60px)"/>

  <!-- Main Card Container -->
  <rect x="70" y="60" width="1140" height="600" rx="28" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Header Section -->
  <rect x="110" y="100" width="56" height="56" rx="14" fill="url(#accentGrad)"/>
  <!-- Trackpad gesture icon -->
  <path d="M124 132 C124 120 152 120 152 132 M131 128 L131 120 M138 126 L138 116 M145 128 L145 119" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>

  <text x="182" y="132" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">macOS Gestures</text>
  <text x="182" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Native Spaces Navigation for Omarchy &amp; Hyprland</text>

  <rect x="1010" y="105" width="160" height="34" rx="17" fill="#334155" opacity="0.6"/>
  <text x="1090" y="127" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">v1.1.0 • Service</text>

  <!-- Divider -->
  <line x1="110" y1="180" x2="1170" y2="180" stroke="#334155" stroke-width="1" opacity="0.6"/>

  <!-- Left Feature Column: Interactive Spaces Diagram -->
  <g transform="translate(110, 215)">
    <!-- Workspace 1 Card -->
    <rect x="0" y="40" width="220" height="150" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5" opacity="0.6"/>
    <rect x="16" y="56" width="70" height="10" rx="5" fill="#64748b"/>
    <rect x="16" y="80" width="188" height="90" rx="8" fill="#0f172a" opacity="0.8"/>
    <text x="110" y="130" fill="#64748b" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Space 1</text>

    <!-- Active Workspace 2 Card -->
    <rect x="250" y="20" width="260" height="180" rx="18" fill="#1e293b" stroke="#f97316" stroke-width="2.5" filter="url(#shadow)"/>
    <rect x="270" y="42" width="90" height="12" rx="6" fill="#f97316"/>
    <rect x="270" y="70" width="220" height="110" rx="10" fill="#0f172a"/>
    <circle cx="286" cy="85" r="4" fill="#ef4444"/>
    <circle cx="298" cy="85" r="4" fill="#eab308"/>
    <circle cx="310" cy="85" r="4" fill="#22c55e"/>
    <text x="380" y="135" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Active Space 2</text>

    <!-- Workspace 3 Card -->
    <rect x="540" y="40" width="220" height="150" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5" opacity="0.6"/>
    <rect x="556" y="56" width="70" height="10" rx="5" fill="#64748b"/>
    <rect x="556" y="80" width="188" height="90" rx="8" fill="#0f172a" opacity="0.8"/>
    <text x="650" y="130" fill="#64748b" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Space 3</text>

    <!-- Swipe Arrows and Motion Indicator -->
    <path d="M 200 240 L 560 240" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
    <polygon points="190,240 205,233 205,247" fill="#f97316"/>
    <polygon points="570,240 555,233 555,247" fill="#fb923c"/>
    <text x="380" y="270" fill="#fb923c" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">3-Finger Fluid Horizontal Swipe</text>
  </g>

  <!-- Right Feature Highlights Column -->
  <g transform="translate(860, 215)">
    <!-- Feature 1 -->
    <rect x="0" y="0" width="270" height="85" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">1:1 Native Tracking</text>
    <text x="20" y="56" fill="#94a3b8" font-family="sans-serif" font-size="13">Direct Hyprland continuous swipe</text>
    <text x="20" y="72" fill="#94a3b8" font-family="sans-serif" font-size="13">between workspaces.</text>

    <!-- Feature 2 -->
    <rect x="0" y="100" width="270" height="85" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="132" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">3-Finger Drag Mode</text>
    <text x="20" y="156" fill="#94a3b8" font-family="sans-serif" font-size="13">Optional drag windows with 3 fingers,</text>
    <text x="20" y="172" fill="#94a3b8" font-family="sans-serif" font-size="13">swipe spaces with 4 fingers.</text>

    <!-- Feature 3 -->
    <rect x="0" y="200" width="270" height="85" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="232" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Natural Scroll &amp; Tuning</text>
    <text x="20" y="256" fill="#94a3b8" font-family="sans-serif" font-size="13">Apple-like scrolling physics,</text>
    <text x="20" y="272" fill="#94a3b8" font-family="sans-serif" font-size="13">clickfinger &amp; sensitivity control.</text>
  </g>

  <!-- Footer Information -->
  <g transform="translate(110, 580)">
    <rect x="0" y="0" width="1060" height="50" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="31" fill="#64748b" font-family="monospace" font-size="14">ID: <tspan fill="#f8fafc">io.github.devmercenario.macos-gestures</tspan></text>
    <text x="600" y="31" fill="#64748b" font-family="monospace" font-size="14">CLI: <tspan fill="#38bdf8">omarchy-macos-gestures status</tspan></text>
    <text x="1036" y="31" fill="#22c55e" font-family="monospace" font-size="13" font-weight="600" text-anchor="end">✓ Ready for Omarchy Quattro</text>
  </g>
</svg>
